<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة تحكم كبابجي العربي لإدارة الطلبات" />
    <title>لوحة تحكم كبابجي العربي</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <main class="admin-main">
      <section id="login-section" class="login-section" aria-labelledby="login-title">
        <p class="eyebrow">كبابجي العربي</p>
        <h1 id="login-title">دخول لوحة التحكم</h1>
        <form id="login-form">
          <label class="form-field" for="admin-email">البريد الإلكتروني</label>
          <input id="admin-email" type="email" autocomplete="username" required />
          <label class="form-field" for="admin-password">كلمة المرور</label>
          <input id="admin-password" type="password" autocomplete="current-password" required />
          <button class="confirm-order" type="submit">دخول آمن</button>
          <p id="login-message" class="order-message" role="alert"></p>
        </form>
      </section>

      <section id="dashboard-content" hidden>
        <header class="admin-header">
          <div>
            <p class="eyebrow">كبابجي العربي</p>
            <h1>لوحة الطلبات</h1>
            <p id="last-updated" class="last-updated">جاري تحميل البيانات...</p>
          </div>
          <div class="header-actions">
            <button id="refresh-orders" class="admin-secondary-button" type="button">↻ تحديث</button>
            <button id="sign-out" class="admin-secondary-button" type="button">خروج</button>
          </div>
        </header>
        <section class="stats" aria-label="ملخص الطلبات">
          <div class="stat-card"><span>كل الطلبات</span><strong id="total-orders">0</strong></div>
          <div class="stat-card"><span>طلبات جديدة</span><strong id="new-orders">0</strong></div>
          <div class="stat-card"><span>إجمالي المبيعات</span><strong id="total-sales">0 ج.م</strong></div>
          <div class="stat-card"><span>قيد التنفيذ</span><strong id="active-orders">0</strong></div>
        </section>
        <section class="orders-toolbar" aria-label="أدوات البحث والفلترة">
          <label class="search-field" for="order-search"><span>بحث</span><input id="order-search" type="search" placeholder="رقم الطلب، الاسم، الهاتف..." /></label>
          <label class="filter-field" for="status-filter"><span>الحالة</span><select id="status-filter"><option value="all">كل الطلبات</option><option value="new">طلبات جديدة</option><option value="accepted">تم القبول</option><option value="preparing">قيد التحضير</option><option value="delivering">خرج للتوصيل</option><option value="delivered">تم التسليم</option><option value="cancelled">ملغي</option></select></label>
          <label class="filter-field" for="sort-orders"><span>الترتيب</span><select id="sort-orders"><option value="newest">الأحدث أولًا</option><option value="oldest">الأقدم أولًا</option><option value="highest">الأعلى سعرًا</option></select></label>
          <button id="notifications-toggle" class="admin-secondary-button" type="button">🔔 التنبيهات</button>
        </section>
        <section id="orders-list" class="orders-list" aria-live="polite"></section>
      </section>
    </main>
  </body>
</html>
